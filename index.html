<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>милена</title>
<meta name="description" content="милена — телеграм, тикток и канал">
<meta name="theme-color" content="#ebe3f8">
<link rel="icon" href="photo_2026-10-09_21-15-28.jpg">
<link rel="apple-touch-icon" href="photo_2026-10-09_21-15-28.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #fbe1e9;
    --lilac: #ebe3f8;
    --blue: #dbecf8;
    --rose: #e58aa6;
    --ink: #3d2c45;
    --muted: rgba(61, 44, 69, .55);
    --line: rgba(61, 44, 69, .12);
    --tile: rgba(255, 255, 255, .55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html { background: var(--lilac); }
  body {
    min-height: 100vh;
    min-height: 100svh;
    background:
      radial-gradient(70% 45% at 10% 0%, var(--pink) 0%, transparent 70%),
      radial-gradient(70% 45% at 100% 100%, var(--blue) 0%, transparent 70%),
      var(--lilac);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Onest", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
  }

  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 10px; }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  main {
    width: 100%;
    max-width: 420px;
    min-height: 100vh;
    min-height: 100svh;
    padding: calc(28px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  /* ---------- пластинка ---------- */
  .deck {
    position: relative;
    width: min(100%, 340px);
    aspect-ratio: 1;
    margin-top: 8px;
    flex: none;
  }
  .vinyl {
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, #f2b4c6 0 2px, #f6c5d3 2px 3px),
      #f4bccb;
    box-shadow:
      0 0 0 1px rgba(255,255,255,.6) inset,
      0 24px 50px -16px rgba(150, 90, 130, .45);
    display: grid;
    place-items: center;
    cursor: pointer;
    animation: spin 2.4s linear infinite;
    animation-play-state: paused;
  }
  .playing .vinyl { animation-play-state: running; }
  /* наклейка с фото, приближено к лицу */
  .label {
    position: absolute;
    left: 29%; top: 29%;
    width: 42%;
    height: 42%;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 0 4px #fff;
  }
  .label img {
    position: absolute;
    width: 290%;
    height: 290%;
    max-width: none;
    left: -150%;
    top: -42%;
    object-fit: cover;
  }
  /* блик — не крутится */
  .shine {
    position: absolute;
    inset: 4%;
    border-radius: 50%;
    pointer-events: none;
    background: conic-gradient(from 20deg,
      transparent 0deg, rgba(255,255,255,.45) 30deg, transparent 70deg,
      transparent 180deg, rgba(255,255,255,.3) 210deg, transparent 250deg);
  }
  /* тонарм */
  .arm {
    position: absolute;
    top: -2%;
    right: -3%;
    width: 30%;
    transform-origin: 72% 12%;
    transform: rotate(-28deg);
    transition: transform .7s cubic-bezier(.3, .8, .3, 1);
    pointer-events: none;
    filter: drop-shadow(0 6px 8px rgba(110, 70, 110, .3));
  }
  .playing .arm { transform: rotate(0deg); }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- трек ---------- */
  .now {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .song { text-align: center; min-width: 0; }
  .song-title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-artist { margin-top: 4px; color: var(--muted); font-size: 15px; }

  .progress {
    position: relative;
    height: 24px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none;
  }
  .progress .rail {
    position: relative;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
  }
  .progress .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 2px;
    background: var(--ink);
  }
  .progress .knob {
    position: absolute;
    top: 50%;
    left: 0;
    width: 14px; height: 14px;
    margin: -7px 0 0 -7px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 0 0 3px #fff;
  }
  .times {
    display: flex;
    justify-content: space-between;
    margin-top: -6px;
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .jump {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--muted);
    position: relative;
  }
  .jump:active { color: var(--ink); }
  .jump svg { width: 26px; height: 26px; }
  .jump span {
    position: absolute;
    font-size: 9px;
    font-weight: 600;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -42%);
  }
  .play {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow: 0 12px 28px -10px rgba(61, 44, 69, .6);
    transition: transform .15s ease;
  }
  .play:active { transform: scale(.93); }
  .play svg { width: 26px; height: 26px; fill: currentColor; }
  .play .i-pause, .playing .play .i-play { display: none; }
  .playing .play .i-pause { display: block; }

  /* ---------- ссылки ---------- */
  .links {
    list-style: none;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .links a {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 84px;
    padding: 12px 6px;
    border-radius: 18px;
    background: var(--tile);
    border: 1px solid rgba(255, 255, 255, .8);
    box-shadow: 0 6px 18px -12px rgba(61, 44, 69, .35);
    font-size: 14px;
    font-weight: 500;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .links a:hover { background: rgba(255, 255, 255, .85); }
  .links a:active { transform: scale(.96); }
  .links svg { width: 24px; height: 24px; color: var(--rose); }

  footer { margin-top: auto; padding-top: 4px; }
  .credit {
    display: inline-block;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--muted);
    transition: color .2s;
  }
  .credit:hover { color: var(--rose); }

  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px);
    opacity: 0;
    visibility: hidden;
    background: var(--ink);
    color: #fff;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 999px;
    transition: transform .35s cubic-bezier(.2, .7, .2, 1), opacity .35s, visibility .35s;
    max-width: calc(100% - 32px);
    text-align: center;
    z-index: 10;
  }
  .hint.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }

  @media (max-width: 480px) {
    .deck { width: min(84%, 340px); margin-right: 6%; }
  }
  @media (max-height: 740px) {
    main { gap: 20px; padding-top: calc(16px + env(safe-area-inset-top)); }
    .deck { width: min(70%, 300px); }
    .now { gap: 12px; }
    .play { width: 64px; height: 64px; }
    .links a { min-height: 72px; }
  }
  @media (min-height: 820px) {
    main { justify-content: center; gap: 34px; }
    footer { margin-top: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .vinyl { animation: none; }
    .arm, .play, .links a { transition: none; }
  }
</style>
</head>
<body>

<main id="app">
  <h1 class="sr-only">милена</h1>

  <div class="deck">
    <button class="vinyl" id="vinyl" aria-label="включить или выключить песню">
      <span class="label"><img src="photo_2026-10-09_21-15-28.jpg" alt="" width="640" height="640"></span>
    </button>
    <div class="shine" aria-hidden="true"></div>
    <svg class="arm" viewBox="0 0 100 220" aria-hidden="true">
      <circle cx="72" cy="26" r="20" fill="#ffffff" stroke="#cdbfd6" stroke-width="2"/>
      <circle cx="72" cy="26" r="7" fill="#b9a6c6"/>
      <path d="M72 26 L72 150 Q72 172 52 190" stroke="#9e8bab" stroke-width="5" fill="none" stroke-linecap="round"/>
      <rect x="34" y="182" width="26" height="30" rx="4" transform="rotate(38 47 197)" fill="#ffffff" stroke="#9e8bab" stroke-width="2"/>
    </svg>
  </div>

  <section class="now" aria-label="песня">
    <div class="song">
      <div class="song-title" id="songTitle"></div>
      <div class="song-artist" id="songArtist"></div>
    </div>

    <div>
      <div class="progress" id="progress" role="slider" aria-label="перемотка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
        <div class="rail"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div>
      </div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>

    <div class="controls">
      <button class="jump" id="back" aria-label="назад на 10 секунд">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span>10</span>
      </button>
      <button class="play" id="playBtn" aria-label="включить песню">
        <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1"/><rect x="14" y="4.5" width="4.5" height="15" rx="1"/></svg>
      </button>
      <button class="jump" id="fwd" aria-label="вперёд на 10 секунд">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
        <span>10</span>
      </button>
    </div>
  </section>

  <ul class="links">
    <li>
      <a id="linkTg" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1.1-.9 1.3-1.8.8l-4.9-3.6-2.4 2.3c-.3.3-.5.5-1 .5l.3-5 9.1-8.2c.4-.4-.1-.6-.6-.2L6.2 13.1 1.4 11.6c-1-.3-1.1-1 .2-1.5L20.5 2.8c.9-.3 1.6.2 1.4 1.5z"/></svg>
        телеграм
      </a>
    </li>
    <li>
      <a id="linkTt" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 2h-3.4v13.4a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9.1a6.3 6.3 0 1 0 5.4 6.3V8.6a8 8 0 0 0 4.6 1.5V6.7a4.7 4.7 0 0 1-4.6-4.7z"/></svg>
        тикток
      </a>
    </li>
    <li>
      <a id="linkTgk" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11v2a1 1 0 0 0 1 1h3l6 5V5L7 10H4a1 1 0 0 0-1 1z"/><path d="M17 9a4 4 0 0 1 0 6"/><path d="M19.5 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        канал
      </a>
    </li>
  </ul>

  <footer>
    <a class="credit" href="https://t.me/lvlton" target="_blank" rel="noopener">by light</a>
  </footer>
</main>

<div class="hint" id="hint" role="status" aria-live="polite"></div>
<audio id="audio" preload="metadata" loop></audio>

<script>
/* ============================================================
   НАСТРОЙКИ
   ============================================================ */
const CONFIG = {
  telegram: "lalalalililag",
  tiktok:   "milenaay18",
  channel:  "milenaandpopiski",

  // чтобы поменять песню — замени song.mp3 в папке и впиши название
  song: {
    src:    "song.mp3",
    title:  "Красной помадой",
    artist: "FACE"
  }
};

/* ---------- ссылки ---------- */
const $ = id => document.getElementById(id);
$("linkTg").href  = `https://t.me/${CONFIG.telegram}`;
$("linkTt").href  = `https://www.tiktok.com/@${CONFIG.tiktok}`;
$("linkTgk").href = `https://t.me/${CONFIG.channel}`;

/* ---------- плеер ---------- */
const app = $("app"), audio = $("audio"), playBtn = $("playBtn"),
      progress = $("progress"), fill = $("fill"), knob = $("knob"),
      curEl = $("cur"), durEl = $("dur"), hint = $("hint");

$("songTitle").textContent = CONFIG.song.title;
$("songArtist").textContent = CONFIG.song.artist;
audio.src = CONFIG.song.src;

const fmt = s => {
  if (!isFinite(s)) return "0:00";
  s = Math.max(0, Math.floor(s));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

let hintTimer;
const showHint = msg => {
  hint.textContent = msg;
  hint.classList.add("show");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.classList.remove("show"), 3000);
};

const render = () => {
  const d = audio.duration, c = audio.currentTime;
  const pct = isFinite(d) && d > 0 ? (c / d) * 100 : 0;
  fill.style.width = pct + "%";
  knob.style.left = pct + "%";
  progress.setAttribute("aria-valuenow", Math.round(pct));
  curEl.textContent = fmt(c);
  durEl.textContent = fmt(d);
};

const setPlaying = on => {
  app.classList.toggle("playing", on);
  playBtn.setAttribute("aria-label", on ? "пауза" : "включить песню");
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = on ? "playing" : "paused";
};

const toggle = async () => {
  if (audio.paused) {
    try { await audio.play(); }
    catch { showHint("песня не загрузилась"); }
  } else {
    audio.pause();
  }
};

audio.addEventListener("play", () => setPlaying(true));
audio.addEventListener("pause", () => setPlaying(false));
audio.addEventListener("timeupdate", render);
audio.addEventListener("loadedmetadata", render);
audio.addEventListener("error", () => showHint("песня не найдена: положи song.mp3 рядом с сайтом"));

playBtn.addEventListener("click", toggle);
$("vinyl").addEventListener("click", toggle);
const jump = s => {
  if (!isFinite(audio.duration)) return;
  audio.currentTime = Math.min(audio.duration, Math.max(0, audio.currentTime + s));
  render();
};
$("back").addEventListener("click", () => jump(-10));
$("fwd").addEventListener("click", () => jump(10));

// перемотка пальцем / мышкой
const seekFrom = e => {
  if (!isFinite(audio.duration)) return;
  const r = progress.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  audio.currentTime = f * audio.duration;
  render();
};
progress.addEventListener("pointerdown", e => {
  progress.setPointerCapture(e.pointerId);
  seekFrom(e);
  const move = ev => seekFrom(ev);
  const stop = () => progress.removeEventListener("pointermove", move);
  progress.addEventListener("pointermove", move);
  progress.addEventListener("pointerup", stop, { once: true });
  progress.addEventListener("pointercancel", stop, { once: true });
});
progress.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { jump(5); e.preventDefault(); }
  if (e.key === "ArrowLeft")  { jump(-5); e.preventDefault(); }
});

// пробел — плей/пауза
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !["BUTTON", "A"].includes(document.activeElement.tagName)) {
    e.preventDefault();
    toggle();
  }
});

// управление с экрана блокировки и наушников
if ("mediaSession" in navigator) {
  const cover = new URL("photo_2026-10-09_21-15-28.jpg", location.href).href;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: CONFIG.song.title,
    artist: CONFIG.song.artist,
    artwork: [{ src: cover, sizes: "640x640", type: "image/jpeg" }]
  });
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("seekbackward", () => jump(-10));
  navigator.mediaSession.setActionHandler("seekforward", () => jump(10));
  try {
    navigator.mediaSession.setActionHandler("seekto", d => { audio.currentTime = d.seekTime; render(); });
  } catch {}
}
</script>
</body>
</html>
